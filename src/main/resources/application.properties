spring.application.name=gofunds-backend
server.port=${PORT:8080}

# --- Datasource (Neon PostgreSQL) ---

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER:username}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- Liquibase ---
# Points at the XML master, which includeAll's everything in db/migration/.
# Do NOT point this at the db/migration/ directory: Liquibase 5 rejects a bare
# directory with "Cannot find parser that supports classpath:db/migration/".
# New migrations are just a new db/migration/V3__*.sql - no config change.
spring.liquibase.change-log=classpath:db/changelog.xml

# --- Spring AI (Gemini) ---
# Defaults to empty rather than being mandatory: an absent key disables the Gemini
# provider (isAvailable() -> false) so the app still boots and the registry can
# fail over to another model. Remove the ':' default to make it mandatory.
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=2048

# --- Planner ---
# Funds handed to the model. Kept small deliberately: the AMFI catalogue is ~9,300
# schemes and sending it all would blow the context window for no benefit.
planner.catalog.size=${PLANNER_CATALOG_SIZE:30}

# --- JWT ---
jwt.access.secret=${JWT_ACCESS_SECRET:dev-access-secret-key-9f2h3k661q5w8x2z-89ab}
jwt.access.expiration=900000
jwt.refresh.secret=${JWT_REFRESH_SECRET:dev-refresh-secret-key-4b6d6q0n2p4r6t8w-01cd}
jwt.refresh.expiration=604800000

# --- RSA (PKCS#8 PEM private key) ---
rsa.private-key=${RSA_PRIVATE_KEY}

# --- SMTP (Gmail) ---
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Misc ---
bcrypt.salt-rounds=10
otp.expiration-minutes=15
# Prints the generated OTP to the log so it can be read during local development
# without a real mailbox. The OTP is a live credential for 15 minutes, so this is
# off by default: leave it off anywhere you do not control the log output.
app.dev.log-otp=${LOG_OTP:false}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Funds: AMFI NAV sync ---
amfi.nav-url=${AMFI_NAV_URL:https://www.amfiindia.com/spages/NAVAll.txt}
amfi.sync-cron=${AMFI_SYNC_CRON:0 30 0 * * ?}
# Seeds the catalogue once on startup so you don't have to wait for the cron.
# Dev convenience only - the upsert is idempotent, but leave it off in prod.
funds.sync-on-startup=${FUNDS_SYNC_ON_STARTUP:false}

# --- Paging ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.js.gofunds_backend=DEBUG
