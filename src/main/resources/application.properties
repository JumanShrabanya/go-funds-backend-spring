spring.application.name=gofunds-backend
server.port=${PORT:8000}

# --- Datasource (Neon PostgreSQL) ---

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-shy-salad-b3i614jq-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USER:username}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- Liquibase ---
spring.liquibase.change-log=classpath:db/migration/V1__initial_schema.sql

# --- Spring AI (Gemini) ---
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=2048

# --- JWT ---
jwt.access.secret=${JWT_ACCESS_SECRET:dev-access-secret-key-9f2h3k661q5w8x2z-89ab}
jwt.access.expiration=900000
jwt.refresh.secret=${JWT_REFRESH_SECRET:dev-refresh-secret-key-4b6d6q0n2p4r6t8w-01cd}
jwt.refresh.expiration=604800000

# --- RSA (PKCS#8 PEM private key) ---
rsa.private-key=${RSA_PRIVATE_KEY}

# --- SMTP (Gmail) ---
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Misc ---
bcrypt.salt-rounds=10
otp.expiration-minutes=15
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Logging ---
logging.level.root=INFO
logging.level.com.js.gofunds_backend=DEBUG
