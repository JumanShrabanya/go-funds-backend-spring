services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gofunds-backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # --- Datasource ---
      # Default: the local db service below. For Neon, set DATABASE_URL/DB_USER/
      # DB_PASSWORD in .env (postgres://... or jdbc:postgresql://... both work).
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB:-gofunds}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-gofunds}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-gofunds}}
      # --- Spring AI (Gemini) ---
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # --- RSA (PKCS#8 PEM, newlines must be escaped as \n) ---
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY:-}
      # --- JWT ---
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-key-9f2h3k661q5w8x2z-89ab}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-key-4b6d6q0n2p4r6t8w-01cd}
      # --- SMTP ---
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # --- Misc ---
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LOG_OTP: ${LOG_OTP:-false}
      FUNDS_SYNC_ON_STARTUP: ${FUNDS_SYNC_ON_STARTUP:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: gofunds-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gofunds}
      POSTGRES_USER: ${POSTGRES_USER:-gofunds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gofunds}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
